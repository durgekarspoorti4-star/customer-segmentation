<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Customer Search | Customer Segmentation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 28px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .table-responsive {
            max-height: 550px;
            overflow: auto;
        }
    </style>
</head>

<body>
<div class="container py-4">

    <div class="header">
        <h2>Customer Search &amp; Filter</h2>
        <p class="mb-0">
            Search and filter customers from your segmentation results.
        </p>
    </div>

    <div class="mb-3">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">
            Back to Dashboard
        </a>

        <a href="{{ url_for('results') }}" class="btn btn-primary">
            View Results
        </a>

        <a href="{{ url_for('insights') }}" class="btn btn-warning">
            Customer Insights
        </a>
    </div>

    <div class="card p-4 mb-4">
        <form method="GET" action="{{ url_for('search_customers') }}">
            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Customer ID</label>
                    <input type="text"
                           name="customer_id"
                           class="form-control"
                           value="{{ customer_id }}"
                           placeholder="Enter customer ID">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Customer Segment</label>
                    <select name="segment" class="form-select">
                        <option value="All"
                            {% if selected_segment == "All" %}selected{% endif %}>
                            All Segments
                        </option>

                        <option value="Low Spending"
                            {% if selected_segment == "Low Spending" %}selected{% endif %}>
                            Low Spending
                        </option>

                        <option value="Medium Spending"
                            {% if selected_segment == "Medium Spending" %}selected{% endif %}>
                            Medium Spending
                        </option>

                        <option value="High Spending"
                            {% if selected_segment == "High Spending" %}selected{% endif %}>
                            High Spending
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Minimum Age</label>
                    <input type="number" name="min_age"
                           class="form-control" min="0"
                           value="{{ min_age }}">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Maximum Age</label>
                    <input type="number" name="max_age"
                           class="form-control" min="0"
                           value="{{ max_age }}">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Minimum Annual Income (k$)</label>
                    <input type="number" name="min_income"
                           class="form-control" min="0"
                           value="{{ min_income }}">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Maximum Annual Income (k$)</label>
                    <input type="number" name="max_income"
                           class="form-control" min="0"
                           value="{{ max_income }}">
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Search Customers
                    </button>

                    <a href="{{ url_for('search_customers') }}"
                       class="btn btn-outline-secondary">
                        Clear Filters
                    </a>
                </div>

            </div>
        </form>
    </div>

    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Customer Records</h5>

            <span class="badge bg-primary">
                {{ result_count }} customers
            </span>
        </div>

        <div class="table-responsive">
            {{ customer_table|safe }}
        </div>

        <div class="mt-3">
            <a href="{{ url_for('download_filtered',
                customer_id=customer_id,
                segment=selected_segment,
                min_age=min_age,
                max_age=max_age,
                min_income=min_income,
                max_income=max_income) }}"
               class="btn btn-success">
                Download Customer CSV
            </a>
        </div>
    </div>

</div>
</body>
</html>

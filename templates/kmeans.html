<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>K-Means Clustering</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .main {
            padding: 40px;
        }

        .card-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .k-input {
            font-size: 20px;
            padding: 12px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="main">

        <h1>⚙️ K-Means Clustering</h1>

        <p class="text-muted">
            Group customers according to their purchasing behaviour.
        </p>


        <div class="card-box">

            <h4>Select Number of Clusters</h4>

            <p>
                Choose the value of K for customer segmentation.
            </p>

            <form action="/kmeans" method="POST">

                <label class="form-label">
                    Number of Clusters (K)
                </label>

                <input
                    type="number"
                    name="k"
                    class="form-control k-input"
                    value="3"
                    min="2"
                    max="10"
                    required
                >

                <button
                    type="submit"
                    class="btn btn-primary mt-4">

                    Run K-Means

                </button>

            </form>

        </div>


        {% if result %}

        <div class="card-box">

            <h4>Clustering Completed</h4>

            <div class="alert alert-success">

                K-Means successfully created
                <strong>{{ k }}</strong>
                customer groups.

            </div>

            <a
                href="/results"
                class="btn btn-success">

                View Results →

            </a>

        </div>

        {% endif %}


        <a
            href="/"
            class="btn btn-outline-secondary">

            ← Back to Dashboard

        </a>

    </div>

</div>

</body>

</html>
